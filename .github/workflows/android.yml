name: android

# Сборка APK для RuStore и прямой раздачи.
# Запуск: вручную (workflow_dispatch) или тегом вида v1.0.5.
# Подпись: если в секретах есть ANDROID_KEYSTORE_BASE64, APK подписывается этим
# ключом. Если нет — ключ создаётся один раз прямо в прогоне и выкладывается
# артефактом «keystore»: его base64 надо положить в секреты, иначе следующий
# APK будет подписан другим ключом и не встанет поверх предыдущего.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # На образах GitHub уже стоит Android SDK; action setup-android падал на
      # пакете 'tools' (его убрали из новых sdkmanager), поэтому ставим нужное сами.
      - name: Android SDK
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Веб-сборка
        run: node tools/build-web.js

      - name: Веб-версия внутрь Android-проекта
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r dist-web/. android/app/src/main/assets/www/

      - name: Ключ подписи
        id: keystore
        env:
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -n "$KS_BASE64" ]; then
            echo "$KS_BASE64" | base64 -d > "$RUNNER_TEMP/foxhunt.jks"
            PASS="$KS_PASS"
            echo "Ключ взят из секретов репозитория."
          else
            PASS="foxhunt2026"
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/foxhunt.jks" \
              -alias foxhunt -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Fox Hunt, OU=Game, O=Alexsey111, L=Barnaul, C=RU"
            echo "Секретов нет: создан новый ключ. Его base64 и пароль надо сохранить в секреты ANDROID_KEYSTORE_BASE64 и ANDROID_KEYSTORE_PASSWORD."
          fi
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/foxhunt.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$PASS"
            echo "ANDROID_KEY_ALIAS=foxhunt"
            echo "ANDROID_KEY_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"

      - name: Номер версии
        run: |
          V=$(node -p "require('./package.json').version")
          echo "APP_VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$(( ${V//./} ))" >> "$GITHUB_ENV"

      - name: Сборка APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Артефакты
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/oxota-na-lis-${APP_VERSION_NAME}.apk"
          cp "$RUNNER_TEMP/foxhunt.jks" out/foxhunt-keystore.jks 2>/dev/null || true
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*

      - name: Приложить к релизу
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Сборка APK"
          gh release upload "$TAG" "out/oxota-na-lis-${APP_VERSION_NAME}.apk" --clobber
